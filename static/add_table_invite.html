<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通过邀请码添加数据表</title>
    <!-- <link rel="stylesheet" href="/css/style.css"> --> <!-- 如果您有全局样式表，可以取消注释 -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #333; margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; text-align: left; color: #555; }
        input[type="text"] { width: calc(100% - 22px); padding: 12px; margin-bottom: 25px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[type="text"]:focus { border-color: #007bff; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); outline: none; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: background-color 0.3s ease; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 20px; padding: 12px; border-radius: 4px; font-size: 15px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>通过邀请码添加数据表</h2>
        <label for="inviteCode">邀请码:</label>
        <input type="text" id="inviteCode" name="inviteCode" required>
        <button onclick="submitInviteCode()">提交邀请码</button>
        <div id="responseMessage" class="message" style="display:none;"></div>
    </div>

    <script>
        async function submitInviteCode() {
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const responseMessageDiv = document.getElementById('responseMessage');
            responseMessageDiv.style.display = 'none';
            responseMessageDiv.className = 'message'; // Reset classes

            if (!inviteCode) {
                responseMessageDiv.textContent = '请输入邀请码。';
                responseMessageDiv.classList.add('error');
                responseMessageDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/submit_invite_code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ invite_code: inviteCode }),
                });

                const result = await response.json();

                if (result.success) {
                    responseMessageDiv.textContent = result.message;
                    responseMessageDiv.classList.add('success');
                } else {
                    responseMessageDiv.textContent = result.message;
                    responseMessageDiv.classList.add('error');
                    if (result.redirect) {
                        // Handle redirection, e.g., by alerting and then changing window location
                        alert("会话已过期或未登录，请重新登录。");
                        window.location.href = "/"; // Or your login page
                    }
                }
                responseMessageDiv.style.display = 'block';

            } catch (error) {
                console.error('Error submitting invite code:', error);
                responseMessageDiv.textContent = '提交邀请码时发生网络错误或服务器无响应。';
                responseMessageDiv.classList.add('error');
                responseMessageDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
